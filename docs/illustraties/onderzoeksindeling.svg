<title id="title">EAI Teacher Assistant: onderzoeksindeling</title>
<desc id="desc">Tien gelijkwaardige onderzoekssporen, vier terugkerende onderzoeksthema's en een beweging van brede inventarisatie naar vergelijking, specificatie van A tot en met D en technische proeven. Geen softwarearchitectuur.</desc>
