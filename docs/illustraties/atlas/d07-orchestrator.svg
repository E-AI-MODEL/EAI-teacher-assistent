<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="868" viewBox="0 0 1120 868" role="img" aria-labelledby="d07-title d07-desc"><title id="d07-title">Orchestrator: eerst een toegestane route</title><desc id="d07-desc">Hybride route: gewone functie eerst; experimentele regel MATCH naar engine, UNKNOWN alleen naar toegestane modeltaak, DENY afwijzen. Iedere af te leveren uitkomst vereist actuele rechten en revisie.</desc><defs><marker id="d07-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#52657b"/></marker></defs><rect width="1120" height="868" rx="12" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="36" font-size="13" font-weight="700" fill="#37678e" text-anchor="start">EAI TEACHER ASSISTANT  /  ONDERZOEKSATLAS 07</text><text x="40" y="81" font-size="34" font-weight="700" fill="#18283c" text-anchor="start">Orchestrator: eerst een toegestane route</text><text x="40" y="111" font-size="17" font-weight="400" fill="#52657b" text-anchor="start">C/D: beslis alleen met actuele gegevens. Onbekend is geen toestemming.</text><path d="M 40 132 H 1080" stroke="#c6d2df" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 560 212 V 244" stroke="#52657b" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d07-arrow)"/><path d="M 400 288 H 152 V 340" stroke="#52657b" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d07-arrow)"/><path d="M 560 332 V 356" stroke="#52657b" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d07-arrow)"/><path d="M 392 412 H 336 V 500" stroke="#52657b" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d07-arrow)"/><path d="M 728 412 H 928 V 500" stroke="#52657b" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d07-arrow)"/><path d="M 560 468 V 500" stroke="#52657b" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d07-arrow)"/><path d="M 152 408 V 656" stroke="#52657b" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d07-arrow)"/><path d="M 336 572 V 656" stroke="#52657b" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d07-arrow)"/><path d="M 928 572 V 656" stroke="#52657b" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d07-arrow)"/><text x="210" y="276" font-size="13" font-weight="700" fill="#52657b" text-anchor="start">JA</text><text x="574" y="346" font-size="13" font-weight="700" fill="#52657b" text-anchor="start">NEE</text><text x="270" y="400" font-size="13" font-weight="700" fill="#52657b" text-anchor="start">MATCH</text><text x="752" y="399" font-size="13" font-weight="700" fill="#52657b" text-anchor="start">UNKNOWN + toegestaan</text><text x="574" y="487" font-size="13" font-weight="700" fill="#52657b" text-anchor="start">DENY / geen recht</text><g data-block-id="D07-IN" data-block-sources="S11 S12" data-block-status="projectontwerp"><title>Autoriseer en selecteer context</title><rect x="364" y="160" width="392" height="52" rx="8" fill="#fff" stroke="#c6d2df" stroke-width="1"/><text x="560" y="192" font-size="19" font-weight="700" fill="#18283c" text-anchor="middle">Na toelating: selecteer context</text></g><g data-block-id="D07-K0" data-block-sources="S11 S12" data-block-status="projectontwerp"><title>Gewone functie?</title><path d="M 560 244 L 720 288 L 560 332 L 400 288 Z" fill="#fff" stroke="#c6d2df"/><text x="560" y="294" font-size="18" font-weight="700" fill="#18283c" text-anchor="middle">Gewone functie?</text></g><g data-block-id="D07-LOOKUP" data-block-sources="S11 S12" data-block-status="projectontwerp"><title>Gemeenschappelijke lookup</title><rect x="40" y="340" width="224" height="68" rx="8" fill="#fff" stroke="#c6d2df" stroke-width="1"/><text x="56" y="369" font-size="18" font-weight="700" fill="#18283c" text-anchor="start">K0: gewone lookup</text><text x="56" y="392" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">Gedeeld door A–D</text></g><g data-block-id="D07-RULE" data-block-sources="S11 S12" data-block-status="projectontwerp"><title>Regelbesluit</title><path d="M 560 356 L 728 412 L 560 468 L 392 412 Z" fill="#e4edf5" stroke="#37678e" stroke-width="1.5"/><text x="560" y="408" font-size="21" font-weight="700" fill="#18283c" text-anchor="middle">Regelbesluit</text><text x="560" y="433" font-size="15" font-weight="400" fill="#52657b" text-anchor="middle">Toets toepasselijkheid</text></g><g data-block-id="D07-ENGINE" data-block-sources="S11 S12" data-block-status="projectontwerp"><title>Engine</title><rect x="232" y="500" width="208" height="72" rx="8" fill="#fff" stroke="#c6d2df" stroke-width="1"/><text x="248" y="530" font-size="20" font-weight="700" fill="#18283c" text-anchor="start">Engine</text><text x="248" y="552" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">Bekende bewerking</text></g><g data-block-id="D07-DENY" data-block-sources="S11 S12" data-block-status="projectontwerp"><title>Afwijzen</title><rect x="464" y="500" width="192" height="72" rx="8" fill="#e9eef3" stroke="#c6d2df" stroke-width="1"/><text x="480" y="530" font-size="20" font-weight="700" fill="#18283c" text-anchor="start">Afwijzen</text><text x="480" y="552" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">Geen modelomweg</text></g><g data-block-id="D07-MODEL" data-block-sources="S11 S12" data-block-status="projectontwerp"><title>Eén modeltaak</title><rect x="776" y="500" width="304" height="72" rx="8" fill="#fff" stroke="#c6d2df" stroke-width="1"/><text x="792" y="530" font-size="20" font-weight="700" fill="#18283c" text-anchor="start">Eén modeltaak</text><text x="792" y="552" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">C extern · D lokaal (stub in 4a)</text></g><g data-block-id="D07-CHECK" data-block-sources="S11 S12" data-block-status="projectontwerp"><title>Controle vóór aflevering</title><rect x="40" y="656" width="1040" height="88" rx="8" fill="#fff" stroke="#c6d2df" stroke-width="1"/><text x="56" y="686" font-size="22" font-weight="700" fill="#18283c" text-anchor="start">Controle vóór aflevering</text><text x="56" y="714" font-size="16" font-weight="400" fill="#52657b" text-anchor="start">Voorstel, actuele rechten en revisies. Alleen geldige uitkomst afleveren; alle pogingen registreren.</text></g><text x="40" y="782" font-size="16" font-weight="400" fill="#52657b" text-anchor="start">Enginefout is geen UNKNOWN. Een onbeschikbare adapter D valt niet terug op externe inferentie.</text><text x="40" y="805" font-size="15" fill="#52657b">Afgewezen aanvragen worden ook geregistreerd, zonder modeldispatch.</text><path d="M 40 824 H 1080" stroke="#c6d2df" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="849" font-size="14" font-weight="400" fill="#52657b" text-anchor="start">S11, S12 · Ontwerp voor fase 4a; echte transport- en netwerkgrenzen blijven te testen.</text></g></svg>
