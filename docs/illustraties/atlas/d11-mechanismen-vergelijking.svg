<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="696" viewBox="0 0 1120 696" role="img" aria-labelledby="d11-title d11-desc"><title id="d11-title">Van bronvondst naar toetsbare techniek</title><desc id="d11-desc">Vier groepen mechanismen en tegenproeven uit ronde 11. Geen nieuwe uitvoeringstest.</desc><rect width="1120" height="696" rx="12" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="36" font-size="13" font-weight="700" fill="#37678e">EAI TEACHER ASSISTANT / ONDERZOEKSATLAS 11</text><text x="40" y="81" font-size="34" font-weight="700" fill="#18283c">Van bronvondst naar toetsbare techniek</text><text x="40" y="111" font-size="17" font-weight="400" fill="#52657b">14 verdiepingsrecords; geen gekozen architectuur.</text><path d="M40 132 H1080" stroke="#c6d2df"/><text x="40" y="160" font-size="13" font-weight="700" fill="#52657b">GROEP</text><text x="300" y="160" font-size="13" font-weight="700" fill="#52657b">MECHANISMEN</text><text x="755" y="160" font-size="13" font-weight="700" fill="#52657b">TEGENPROEF</text><g data-block-id="D11-COMPILER" data-block-sources="S53" data-block-status="afgeleid_onderzoek"><title>Compiler</title><rect x="40" y="178" width="1040" height="104" rx="8" fill="#fff" stroke="#c6d2df"/><rect x="40" y="190" width="4" height="80" rx="2" fill="#37678e"/><path d="M280 193 V267 M735 193 V267" stroke="#c6d2df"/><text x="56" y="221" font-size="23" font-weight="700" fill="#18283c">Compiler</text><text x="56" y="252" font-size="15" font-weight="400" fill="#52657b">4 records</text><text x="300" y="219" font-size="17" font-weight="700" fill="#18283c">Getypeerde nodes en validatie</text><text x="300" y="247" font-size="16" font-weight="400" fill="#18283c">Manifest zonder vrije modelcode</text><text x="755" y="232" font-size="15" font-weight="700" fill="#18283c">Verboden node of parameter</text></g><g data-block-id="D11-ROUTERING" data-block-sources="S53" data-block-status="afgeleid_onderzoek"><title>Routering</title><rect x="40" y="293" width="1040" height="104" rx="8" fill="#fff" stroke="#c6d2df"/><rect x="40" y="305" width="4" height="80" rx="2" fill="#37678e"/><path d="M280 308 V382 M735 308 V382" stroke="#c6d2df"/><text x="56" y="336" font-size="23" font-weight="700" fill="#18283c">Routering</text><text x="56" y="367" font-size="15" font-weight="400" fill="#52657b">5 records</text><text x="300" y="334" font-size="17" font-weight="700" fill="#18283c">Drempels en alle aanroeppaden</text><text x="300" y="362" font-size="16" font-weight="400" fill="#18283c">Heuristiek, lock en echte usage</text><text x="755" y="347" font-size="15" font-weight="700" fill="#18283c">Vergelijk fouten én totale kosten</text></g><g data-block-id="D11-CACHE" data-block-sources="S53" data-block-status="afgeleid_onderzoek"><title>Cache</title><rect x="40" y="408" width="1040" height="104" rx="8" fill="#fff" stroke="#c6d2df"/><rect x="40" y="420" width="4" height="80" rx="2" fill="#37678e"/><path d="M280 423 V497 M735 423 V497" stroke="#c6d2df"/><text x="56" y="451" font-size="23" font-weight="700" fill="#18283c">Cache</text><text x="56" y="482" font-size="15" font-weight="400" fill="#52657b">2 records</text><text x="300" y="449" font-size="17" font-weight="700" fill="#18283c">Prefix, modelrevisie en scope</text><text x="300" y="477" font-size="16" font-weight="400" fill="#18283c">Readiness en warmup apart</text><text x="755" y="462" font-size="15" font-weight="700" fill="#18283c">Warm/koud, scope en cache-hit</text></g><g data-block-id="D11-RUNTIME" data-block-sources="S53" data-block-status="afgeleid_onderzoek"><title>Runtime</title><rect x="40" y="523" width="1040" height="104" rx="8" fill="#fff" stroke="#c6d2df"/><rect x="40" y="535" width="4" height="80" rx="2" fill="#37678e"/><path d="M280 538 V612 M735 538 V612" stroke="#c6d2df"/><text x="56" y="566" font-size="23" font-weight="700" fill="#18283c">Runtime</text><text x="56" y="597" font-size="15" font-weight="400" fill="#52657b">3 records</text><text x="300" y="564" font-size="17" font-weight="700" fill="#18283c">Model-lock en lifecycle</text><text x="300" y="592" font-size="16" font-weight="400" fill="#18283c">Prefill, decode en stopgrens</text><text x="755" y="577" font-size="15" font-weight="700" fill="#18283c">Parallel, stop en geheugen</text></g><text x="40" y="674" font-size="14" font-weight="700" fill="#52657b">Broninspectie en historische metingen · geen nieuwe uitvoeringstest · fase 4a: NO-GO</text></g></svg>
