<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="768" viewBox="0 0 1120 768" role="img" aria-labelledby="d03-title d03-desc"><title id="d03-title">Veertien mechanismen, vier onderzoeksgroepen</title><desc id="d03-desc">Veertien mechanismen: gedeelde functies, optimalisatie in B, extra hybride routes in C/D, inferentieplaats in D. Groepering is geen afhankelijkheidsgrafiek.</desc><defs><marker id="d03-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#52657b"/></marker></defs><rect width="1120" height="768" rx="12" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="36" font-size="13" font-weight="700" fill="#37678e" text-anchor="start">EAI TEACHER ASSISTANT  /  ONDERZOEKSATLAS 03</text><text x="40" y="81" font-size="34" font-weight="700" fill="#18283c" text-anchor="start">Veertien mechanismen, vier onderzoeksgroepen</text><text x="40" y="111" font-size="17" font-weight="400" fill="#52657b" text-anchor="start">Wat houden we gelijk? Wat veranderen we afzonderlijk in de vergelijking?</text><path d="M 40 132 H 1080" stroke="#c6d2df" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="164" width="512" height="300" rx="8" fill="#fff" stroke="#c6d2df" stroke-width="1"/><text x="60" y="189" font-size="12" font-weight="700" fill="#52657b" text-anchor="start">ZELFDE UITGANGSPUNT</text><text x="60" y="219" font-size="23" font-weight="700" fill="#18283c" text-anchor="start">Gedeeld in A–D</text><g data-block-id="M01" data-block-sources="S11 S14" data-block-status="onderzoekskandidaat"><title>Identiteit: Gezaghebbende ID's</title><text x="60" y="250" font-size="14" font-weight="700" fill="#37678e" text-anchor="start">M01</text><text x="116" y="250" font-size="16" font-weight="700" fill="#18283c" text-anchor="start">Identiteit</text><text x="308" y="250" font-size="14" font-weight="400" fill="#52657b" text-anchor="start">Gezaghebbende ID's</text></g><g data-block-id="M02" data-block-sources="S11 S14" data-block-status="onderzoekskandidaat"><title>Voorbereiding: Gedeelde bronbundel</title><text x="60" y="284" font-size="14" font-weight="700" fill="#37678e" text-anchor="start">M02</text><text x="116" y="284" font-size="16" font-weight="700" fill="#18283c" text-anchor="start">Voorbereiding</text><text x="308" y="284" font-size="14" font-weight="400" fill="#52657b" text-anchor="start">Gedeelde bronbundel</text></g><g data-block-id="M03" data-block-sources="S11 S14" data-block-status="onderzoekskandidaat"><title>Hulp-eenheden: Zelfde beschikbare bron</title><text x="60" y="318" font-size="14" font-weight="700" fill="#37678e" text-anchor="start">M03</text><text x="116" y="318" font-size="16" font-weight="700" fill="#18283c" text-anchor="start">Hulp-eenheden</text><text x="308" y="318" font-size="14" font-weight="400" fill="#52657b" text-anchor="start">Zelfde beschikbare bron</text></g><g data-block-id="M09" data-block-sources="S11 S14" data-block-status="onderzoekskandidaat"><title>Modeltaak: Geen verplichte dubbele call</title><text x="60" y="352" font-size="14" font-weight="700" fill="#37678e" text-anchor="start">M09</text><text x="116" y="352" font-size="16" font-weight="700" fill="#18283c" text-anchor="start">Modeltaak</text><text x="308" y="352" font-size="14" font-weight="400" fill="#52657b" text-anchor="start">Geen verplichte dubbele call</text></g><g data-block-id="M11" data-block-sources="S11 S14" data-block-status="onderzoekskandidaat"><title>Sessiestaat: Zelfde actueel minimum</title><text x="60" y="386" font-size="14" font-weight="700" fill="#37678e" text-anchor="start">M11</text><text x="116" y="386" font-size="16" font-weight="700" fill="#18283c" text-anchor="start">Sessiestaat</text><text x="308" y="386" font-size="14" font-weight="400" fill="#52657b" text-anchor="start">Zelfde actueel minimum</text></g><g data-block-id="M13" data-block-sources="S11 S14" data-block-status="onderzoekskandidaat"><title>Rapportage: Apart gebruikspad</title><text x="60" y="420" font-size="14" font-weight="700" fill="#37678e" text-anchor="start">M13</text><text x="116" y="420" font-size="16" font-weight="700" fill="#18283c" text-anchor="start">Rapportage</text><text x="308" y="420" font-size="14" font-weight="400" fill="#52657b" text-anchor="start">Apart gebruikspad</text></g><rect x="568" y="164" width="512" height="300" rx="8" fill="#e4edf5" stroke="#37678e" stroke-width="1"/><text x="588" y="189" font-size="12" font-weight="700" fill="#52657b" text-anchor="start">A → B</text><text x="588" y="219" font-size="23" font-weight="700" fill="#18283c" text-anchor="start">B: efficiëntere modeltaak</text><g data-block-id="M04" data-block-sources="S11 S14" data-block-status="onderzoekskandidaat"><title>Retrieval: Selectie; basis gedeeld</title><text x="588" y="250" font-size="14" font-weight="700" fill="#37678e" text-anchor="start">M04</text><text x="644" y="250" font-size="16" font-weight="700" fill="#18283c" text-anchor="start">Retrieval</text><text x="836" y="250" font-size="14" font-weight="400" fill="#52657b" text-anchor="start">Selectie; basis gedeeld</text></g><g data-block-id="M05" data-block-sources="S11 S14" data-block-status="onderzoekskandidaat"><title>Representatie: Velden en compacte vorm</title><text x="588" y="284" font-size="14" font-weight="700" fill="#37678e" text-anchor="start">M05</text><text x="644" y="284" font-size="16" font-weight="700" fill="#18283c" text-anchor="start">Representatie</text><text x="836" y="284" font-size="14" font-weight="400" fill="#52657b" text-anchor="start">Velden en compacte vorm</text></g><g data-block-id="M06" data-block-sources="S11 S14" data-block-status="onderzoekskandidaat"><title>Cache: Gedeeld; prefix testen</title><text x="588" y="318" font-size="14" font-weight="700" fill="#37678e" text-anchor="start">M06</text><text x="644" y="318" font-size="16" font-weight="700" fill="#18283c" text-anchor="start">Cache</text><text x="836" y="318" font-size="14" font-weight="400" fill="#52657b" text-anchor="start">Gedeeld; prefix testen</text></g><g data-block-id="M12" data-block-sources="S11 S14" data-block-status="onderzoekskandidaat"><title>Outputcontract: Lengte; grenzen gedeeld</title><text x="588" y="352" font-size="14" font-weight="700" fill="#37678e" text-anchor="start">M12</text><text x="644" y="352" font-size="16" font-weight="700" fill="#18283c" text-anchor="start">Outputcontract</text><text x="836" y="352" font-size="14" font-weight="400" fill="#52657b" text-anchor="start">Lengte; grenzen gedeeld</text></g><rect x="40" y="480" width="512" height="224" rx="8" fill="#fff" stroke="#c6d2df" stroke-width="1"/><text x="60" y="505" font-size="12" font-weight="700" fill="#52657b" text-anchor="start">B → C</text><text x="60" y="535" font-size="23" font-weight="700" fill="#18283c" text-anchor="start">C/D: modelwerk vermijden</text><g data-block-id="M07" data-block-sources="S11 S14" data-block-status="onderzoekskandidaat"><title>Engine: Toetsbare bewerking</title><text x="60" y="566" font-size="14" font-weight="700" fill="#37678e" text-anchor="start">M07</text><text x="116" y="566" font-size="16" font-weight="700" fill="#18283c" text-anchor="start">Engine</text><text x="308" y="566" font-size="14" font-weight="400" fill="#52657b" text-anchor="start">Toetsbare bewerking</text></g><g data-block-id="M08" data-block-sources="S11 S14" data-block-status="onderzoekskandidaat"><title>Semantische selectie: Referentie of generatie</title><text x="60" y="600" font-size="14" font-weight="700" fill="#37678e" text-anchor="start">M08</text><text x="116" y="600" font-size="16" font-weight="700" fill="#18283c" text-anchor="start">Semantische selectie</text><text x="308" y="600" font-size="14" font-weight="400" fill="#52657b" text-anchor="start">Referentie of generatie</text></g><g data-block-id="M10" data-block-sources="S11 S14" data-block-status="onderzoekskandidaat"><title>Extra controle: Alleen bij noodzaak</title><text x="60" y="634" font-size="14" font-weight="700" fill="#37678e" text-anchor="start">M10</text><text x="116" y="634" font-size="16" font-weight="700" fill="#18283c" text-anchor="start">Extra controle</text><text x="308" y="634" font-size="14" font-weight="400" fill="#52657b" text-anchor="start">Alleen bij noodzaak</text></g><rect x="568" y="480" width="512" height="224" rx="8" fill="#fff" stroke="#c6d2df" stroke-width="1"/><text x="588" y="505" font-size="12" font-weight="700" fill="#52657b" text-anchor="start">C → D</text><text x="588" y="535" font-size="23" font-weight="700" fill="#18283c" text-anchor="start">D: inferentieplaats</text><g data-block-id="M14" data-block-sources="S11 S14" data-block-status="onderzoekskandidaat"><title>Hosting: Zelfde hybride route, lokaal</title><text x="588" y="566" font-size="14" font-weight="700" fill="#37678e" text-anchor="start">M14</text><text x="644" y="566" font-size="16" font-weight="700" fill="#18283c" text-anchor="start">Hosting</text><text x="836" y="566" font-size="14" font-weight="400" fill="#52657b" text-anchor="start">Zelfde hybride route, lokaal</text></g><text x="588" y="622" font-size="16" font-weight="400" fill="#52657b" text-anchor="start">Modelkeuze en hosting apart testen.</text><text x="588" y="646" font-size="16" font-weight="400" fill="#52657b" text-anchor="start">Geen externe runtime-inferentie.</text><path d="M 40 724 H 1080" stroke="#c6d2df" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="749" font-size="14" font-weight="400" fill="#52657b" text-anchor="start">S11, S14 · M01–M14 zijn onderzoekskandidaten, niet veertien verplichte bouwonderdelen.</text></g></svg>
