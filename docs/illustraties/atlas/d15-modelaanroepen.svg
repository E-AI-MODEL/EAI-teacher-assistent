<svg xmlns="http://www.w3.org/2000/svg" width="960" height="472" viewBox="0 0 960 472" role="img" aria-labelledby="d15-title d15-desc"><title id="d15-title">Tel alle modelaanroepen, niet alleen het antwoord</title><desc id="d15-desc">Een historisch normaal tekstpad heeft drie vaste gatewaypaden en conditionele beeld- en herstelpaden. De nieuwe hypothese onderzoekt nul inferentie bij een regelmatch en één afgebakende modeltaak bij een toegestane onbekende aanvraag.</desc><defs><marker id="d15-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52657b"/></marker></defs><rect width="960" height="472" rx="12" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="28" font-size="13" font-weight="700" fill="#37678e" text-anchor="start">HISTORISCH NORMAAL TEKSTPAD · CODE-INSPECTIE</text><g data-block-id="D15-HISTORY" data-block-sources="S51 S53" data-block-status="historische_bron"><rect x="30" y="62" width="164" height="84" rx="7" fill="#ffffff" stroke="#c6d2df"/><text x="112" y="92" font-size="18" font-weight="700" fill="#18283c" text-anchor="middle">Vooraf</text><text x="112" y="116" font-size="18" font-weight="700" fill="#18283c" text-anchor="middle">classificeren</text><text x="112" y="163" font-size="13" font-weight="700" fill="#52657b" text-anchor="middle">VAST PAD</text><path d="M194 104H214" fill="none" stroke="#52657b" stroke-width="1.8" marker-end="url(#d15-arrow)" stroke-linecap="round" stroke-linejoin="round"/><rect x="214" y="62" width="164" height="84" rx="7" fill="#ffffff" stroke="#c6d2df"/><text x="296" y="92" font-size="18" font-weight="700" fill="#18283c" text-anchor="middle">Antwoord</text><text x="296" y="116" font-size="18" font-weight="700" fill="#18283c" text-anchor="middle">genereren</text><text x="296" y="163" font-size="13" font-weight="700" fill="#52657b" text-anchor="middle">VAST PAD</text><path d="M378 104H398" fill="none" stroke="#52657b" stroke-width="1.8" marker-end="url(#d15-arrow)" stroke-linecap="round" stroke-linejoin="round"/><rect x="398" y="62" width="164" height="84" rx="7" fill="#ffffff" stroke="#c6d2df"/><text x="480" y="92" font-size="18" font-weight="700" fill="#18283c" text-anchor="middle">Achteraf</text><text x="480" y="116" font-size="18" font-weight="700" fill="#18283c" text-anchor="middle">classificeren</text><text x="480" y="163" font-size="13" font-weight="700" fill="#52657b" text-anchor="middle">VAST PAD</text><path d="M562 104H582" fill="none" stroke="#52657b" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#d15-arrow)" stroke-linecap="round" stroke-linejoin="round"/><rect x="582" y="62" width="164" height="84" rx="7" fill="#f5f7fa" stroke="#37678e"/><text x="664" y="92" font-size="18" font-weight="700" fill="#18283c" text-anchor="middle">Beeld</text><text x="664" y="116" font-size="18" font-weight="700" fill="#18283c" text-anchor="middle">per label</text><text x="664" y="163" font-size="13" font-weight="700" fill="#37678e" text-anchor="middle">OPTIONEEL × N</text><path d="M746 104H766" fill="none" stroke="#52657b" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#d15-arrow)" stroke-linecap="round" stroke-linejoin="round"/><rect x="766" y="62" width="164" height="84" rx="7" fill="#f5f7fa" stroke="#37678e"/><text x="848" y="92" font-size="18" font-weight="700" fill="#18283c" text-anchor="middle">Herstel</text><text x="848" y="116" font-size="18" font-weight="700" fill="#18283c" text-anchor="middle">bij afwijking</text><text x="848" y="163" font-size="13" font-weight="700" fill="#37678e" text-anchor="middle">OPTIONEEL +1</text></g><text x="30" y="193" font-size="16" font-weight="400" fill="#52657b" text-anchor="start">3 vaste paden + conditionele extra paden; geen werkelijk gemeten aantal.</text><path d="M30 213H930" fill="none" stroke="#c6d2df" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="245" font-size="13" font-weight="700" fill="#37678e" text-anchor="start">NIEUWE HYPOTHESE · ÉÉN GEDEELD CONTRACT</text><g data-block-id="D15-REQUEST" data-block-sources="S11 S51" data-block-status="ontwerpvoorstel"><rect x="30" y="273" width="260" height="80" rx="9" fill="#ffffff" stroke="#c6d2df"/><text x="45" y="302" font-size="19" font-weight="700" fill="#18283c" text-anchor="start">Geautoriseerde vraag</text><text x="45" y="325" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">Bepaal de toegestane route</text></g><path d="M290 313H325V292H355" fill="none" stroke="#52657b" stroke-width="1.8" marker-end="url(#d15-arrow)" stroke-linecap="round" stroke-linejoin="round"/><path d="M325 313V396H355" fill="none" stroke="#52657b" stroke-width="1.8" marker-end="url(#d15-arrow)" stroke-linecap="round" stroke-linejoin="round"/><g data-block-id="D15-RULE" data-block-sources="S11 S51" data-block-status="ontwerpvoorstel"><rect x="355" y="253" width="355" height="78" rx="9" fill="#ffffff" stroke="#c6d2df"/><text x="370" y="282" font-size="19" font-weight="700" fill="#18283c" text-anchor="start">MATCH / gedeelde lookup</text><text x="370" y="305" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">Uitvoerder gebruikt bekende gegevens</text></g><g data-block-id="D15-MODEL" data-block-sources="S11 S52" data-block-status="ontwerpvoorstel"><rect x="355" y="356" width="355" height="78" rx="9" fill="#e6eff6" stroke="#c6d2df"/><text x="370" y="385" font-size="19" font-weight="700" fill="#18283c" text-anchor="start">UNKNOWN + toestemming</text><text x="370" y="408" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">Eén begrensd modelvoorstel</text></g><path d="M710 292H750" fill="none" stroke="#52657b" stroke-width="1.8" marker-end="url(#d15-arrow)" stroke-linecap="round" stroke-linejoin="round"/><path d="M710 395H750" fill="none" stroke="#52657b" stroke-width="1.8" marker-end="url(#d15-arrow)" stroke-linecap="round" stroke-linejoin="round"/><g data-block-id="D15-COUNTS" data-block-sources="S11 S53" data-block-status="ontwerpvoorstel"><rect x="750" y="253" width="180" height="78" rx="9" fill="#ffffff" stroke="#c6d2df"/><text x="840" y="287" font-size="29" font-weight="700" fill="#18283c" text-anchor="middle">0</text><text x="840" y="309" font-size="13" font-weight="700" fill="#52657b" text-anchor="middle">INFERENTIES</text><rect x="750" y="356" width="180" height="78" rx="9" fill="#e6eff6" stroke="#c6d2df"/><text x="840" y="390" font-size="29" font-weight="700" fill="#37678e" text-anchor="middle">1</text><text x="840" y="412" font-size="13" font-weight="700" fill="#52657b" text-anchor="middle">MODELTAK</text></g><text x="30" y="450" font-size="15" font-weight="400" fill="#a34f38" text-anchor="start">DENY: geen inferentie om de weigering heen. Alle routes registreren ook fouten.</text></g></svg>
