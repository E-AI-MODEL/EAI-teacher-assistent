deltaak</text><path d="M696 417H750" fill="none" stroke="#52657b" stroke-width="1.8" marker-end="url(#d16-arrow)" stroke-linecap="round" stroke-linejoin="round"/><rect x="750" y="386" width="180" height="62" rx="9" fill="#e6eff6" stroke="#c6d2df"/><text x="840" y="423" font-size="17" font-weight="700" fill="#18283c" text-anchor="middle">Engine / lokaal</text></g><text x="30" y="489" font-size="13" font-weight="700" fill="#52657b" text-anchor="start">A–C: DEZELFDE EXTERNE MODELREVISIE OP MODELROUTE · D: GEEN EXTERNE RUNTIME-INFERENTIE</text></g></svg>
