<svg xmlns="http://www.w3.org/2000/svg" width="960" height="515" viewBox="0 0 960 515" role="img" aria-labelledby="d16-title d16-desc"><title id="d16-title">Vier uitvoeringsvormen, geen vier verschillende producten</title><desc id="d16-desc">Vier rijbanen vergelijken relevante standaardcontext, doelgerichte context, hybride regels en lokale inferentie. Gewone lookup en autorisatie zijn gedeeld. A, B en C gebruiken dezelfde externe modelrevisie wanneer zij een modeltaak uitvoeren.</desc><defs><marker id="d16-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52657b"/></marker></defs><rect width="960" height="515" rx="12" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><g data-block-id="D16-SHARED" data-block-sources="S11 S12" data-block-status="ontwerpvoorstel"><rect x="30" y="25" width="900" height="64" rx="9" fill="#ffffff" stroke="#c6d2df"/><text x="48" y="52" font-size="20" font-weight="700" fill="#18283c" text-anchor="start">Gedeeld: bron, bevoegdheden, gewone lookup en aangeboden aanvraag</text><text x="48" y="73" font-size="14" font-weight="400" fill="#52657b" text-anchor="start">K0 gebruikt in alle vier geen model. De experimentele taak hieronder kan wel inferentie vragen.</text></g><text x="90" y="123" font-size="13" font-weight="700" fill="#37678e" text-anchor="start">CONTEXT</text><text x="391" y="123" font-size="13" font-weight="700" fill="#37678e" text-anchor="start">EXPERIMENTELE ROUTE</text><text x="753" y="123" font-size="13" font-weight="700" fill="#37678e" text-anchor="start">UITVOERDER</text><g data-block-id="D16-LANE-A" data-block-sources="S11 S12 S54" data-block-status="ontwerpvoorstel"><rect x="30" y="143" width="48" height="62" rx="6" fill="#18283c" stroke="#18283c"/><text x="54" y="182" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">A</text><rect x="90" y="143" width="268" height="62" rx="9" fill="#ffffff" stroke="#c6d2df