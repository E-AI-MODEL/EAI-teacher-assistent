<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="696" viewBox="0 0 1120 696" role="img" aria-labelledby="d04-title d04-desc"><title id="d04-title">Wat verandert er tussen A, B, C en D?</title><desc id="d04-desc">A/B gebruiken dezelfde modeltaak; C/D kunnen een experimentele aanvraag zonder model uitvoeren; D gebruikt alleen lokale inferentie. Gewone functies zijn gedeeld.</desc><defs><marker id="d04-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#52657b"/></marker></defs><rect width="1120" height="696" rx="12" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="36" font-size="13" font-weight="700" fill="#37678e" text-anchor="start">EAI TEACHER ASSISTANT  /  ONDERZOEKSATLAS 04</text><text x="40" y="81" font-size="34" font-weight="700" fill="#18283c" text-anchor="start">Wat verandert er tussen A, B, C en D?</text><text x="40" y="111" font-size="17" font-weight="400" fill="#52657b" text-anchor="start">Eén gedeeld contract. Alleen benoemde verschillen veranderen per route.</text><path d="M 40 132 H 1080" stroke="#c6d2df" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g data-block-id="D04-SHARED" data-block-sources="S11" data-block-status="projectontwerp"><title>Gedeelde ingang</title><rect x="40" y="160" width="1040" height="68" rx="8" fill="#fff" stroke="#c6d2df" stroke-width="1"/><text x="56" y="188" font-size="20" font-weight="700" fill="#18283c" text-anchor="start">Gedeelde ingang</text><text x="56" y="211" font-size="16" font-weight="400" fill="#52657b" text-anchor="start">Zelfde bron, actuele rechten, gewone lookup en aangeboden aanvragen</text></g><text x="52" y="263" font-size="13" font-weight="700" fill="#52657b" text-anchor="start">VARIANT</text><text x="232" y="263" font-size="13" font-weight="700" fill="#52657b" text-anchor="start">CONTEXT</text><text x="532" y="263" font-size="13" font-weight="700" fill="#52657b" text-anchor="start">EXTRA MODELVRIJE ROUTE</text><text x="804" y="263" font-size="13" font-weight="700" fill="#52657b" text-anchor="start">MODELADAPTER</text><g data-block-id="D04-A" data-block-sources="S11" data-block-status="vergelijkingshypothese"><title>A Reguliere LLM</title><rect x="40" y="280" width="168" height="64" rx="8" fill="#fff" stroke="#c6d2df" stroke-width="1"/><text x="52" y="309" font-size="24" font-weight="700" fill="#37678e" text-anchor="start">A</text><text x="82" y="308" font-size="14" font-weight="700" fill="#18283c" text-anchor="start">Reguliere LLM</text><text x="52" y="329" font-size="11" font-weight="700" fill="#52657b" text-anchor="start">MODELROUTE</text><rect x="220" y="280" width="288" height="64" rx="8" fill="#fff" stroke="#c6d2df" stroke-width="1"/><text x="232" y="318" font-size="17" font-weight="400" fill="#18283c" text-anchor="start">Relevante context</text><rect x="520" y="280" width="260" height="64" rx="8" fill="#fff" stroke="#c6d2df" stroke-width="1"/><text x="532" y="318" font-size="17" font-weight="400" fill="#18283c" text-anchor="start">Geen extra bypass</text><rect x="792" y="280" width="288" height="64" rx="8" fill="#fff" stroke="#c6d2df" stroke-width="1"/><text x="804" y="318" font-size="17" font-weight="700" fill="#18283c" text-anchor="start">Extern model</text></g><g data-block-id="D04-B" data-block-sources="S11" data-block-status="vergelijkingshypothese"><title>B Geoptimaliseerd</title><rect x="40" y="356" width="168" height="64" rx="8" fill="#fff" stroke="#c6d2df" stroke-width="1"/><text x="52" y="385" font-size="24" font-weight="700" fill="#37678e" text-anchor="start">B</text><text x="82" y="384" font-size="14" font-weight="700" fill="#18283c" text-anchor="start">Geoptimaliseerd</text><text x="52" y="405" font-size="11" font-weight="700" fill="#52657b" text-anchor="start">MODELROUTE</text><rect x="220" y="356" width="288" height="64" rx="8" fill="#fff" stroke="#c6d2df" stroke-width="1"/><text x="232" y="380" font-size="17" font-weight="400" fill="#18283c" text-anchor="start">Gerichte context</text><text x="232" y="402" font-size="17" font-weight="400" fill="#18283c" text-anchor="start">Cache / uitvoer</text><rect x="520" y="356" width="260" height="64" rx="8" fill="#fff" stroke="#c6d2df" stroke-width="1"/><text x="532" y="394" font-size="17" font-weight="400" fill="#18283c" text-anchor="start">Geen extra bypass</text><rect x="792" y="356" width="288" height="64" rx="8" fill="#fff" stroke="#c6d2df" stroke-width="1"/><text x="804" y="394" font-size="17" font-weight="700" fill="#18283c" text-anchor="start">Zelfde model als A</text></g><g data-block-id="D04-C" data-block-sources="S11" data-block-status="vergelijkingshypothese"><title>C Hybride</title><rect x="40" y="432" width="168" height="64" rx="8" fill="#fff" stroke="#c6d2df" stroke-width="1"/><text x="52" y="461" font-size="24" font-weight="700" fill="#37678e" text-anchor="start">C</text><text x="82" y="460" font-size="14" font-weight="700" fill="#18283c" text-anchor="start">Hybride</text><text x="52" y="481" font-size="11" font-weight="700" fill="#52657b" text-anchor="start">HYBRIDE</text><rect x="220" y="432" width="288" height="64" rx="8" fill="#fff" stroke="#c6d2df" stroke-width="1"/><text x="232" y="470" font-size="17" font-weight="400" fill="#18283c" text-anchor="start">Als B</text><rect x="520" y="432" width="260" height="64" rx="8" fill="#e4edf5" stroke="#37678e" stroke-width="1"/><text x="532" y="456" font-size="17" font-weight="400" fill="#18283c" text-anchor="start">MATCH → engine</text><text x="532" y="478" font-size="17" font-weight="400" fill="#18283c" text-anchor="start">UNKNOWN → model</text><rect x="792" y="432" width="288" height="64" rx="8" fill="#fff" stroke="#c6d2df" stroke-width="1"/><text x="804" y="470" font-size="17" font-weight="700" fill="#18283c" text-anchor="start">Extern model als B</text></g><g data-block-id="D04-D" data-block-sources="S11" data-block-status="vergelijkingshypothese"><title>D Zelfgehost</title><rect x="40" y="508" width="168" height="64" rx="8" fill="#fff" stroke="#c6d2df" stroke-width="1"/><text x="52" y="537" font-size="24" font-weight="700" fill="#37678e" text-anchor="start">D</text><text x="82" y="536" font-size="14" font-weight="700" fill="#18283c" text-anchor="start">Zelfgehost</text><text x="52" y="557" font-size="11" font-weight="700" fill="#52657b" text-anchor="start">HYBRIDE</text><rect x="220" y="508" width="288" height="64" rx="8" fill="#fff" stroke="#c6d2df" stroke-width="1"/><text x="232" y="546" font-size="17" font-weight="400" fill="#18283c" text-anchor="start">Als B</text><rect x="520" y="508" width="260" height="64" rx="8" fill="#fff" stroke="#c6d2df" stroke-width="1"/><text x="532" y="546" font-size="17" font-weight="400" fill="#18283c" text-anchor="start">Zelfde route als C</text><rect x="792" y="508" width="288" height="64" rx="8" fill="#e4edf5" stroke="#37678e" stroke-width="1"/><text x="804" y="532" font-size="17" font-weight="700" fill="#18283c" text-anchor="start">Lokaal model</text><text x="804" y="554" font-size="17" font-weight="700" fill="#18283c" text-anchor="start">Geen externe inferentie</text></g><g data-block-id="D04-EXIT" data-block-sources="S11 S12" data-block-status="projectontwerp"><title>Gedeelde uitvoergrens</title><rect x="40" y="592" width="1040" height="44" rx="8" fill="#fff" stroke="#c6d2df" stroke-width="1"/><text x="56" y="620" font-size="16" font-weight="700" fill="#18283c" text-anchor="start">Gedeeld: voorstel controleren · rechten en revisie hercontroleren · afleveren · registreren</text></g><path d="M 40 652 H 1080" stroke="#c6d2df" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="677" font-size="14" font-weight="400" fill="#52657b" text-anchor="start">S11 · Vergelijkingsontwerp, geen werkende architectuur of gemeten kostenbesparing.</text></g></svg>
