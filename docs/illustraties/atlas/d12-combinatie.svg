<svg xmlns="http://www.w3.org/2000/svg" width="960" height="625" viewBox="0 0 960 625" role="img" aria-labelledby="d12-title d12-desc"><title id="d12-title">Kan een deel van het gesprek zonder model?</title><desc id="d12-desc">Drie voorbereidingsstappen leveren een versiegebonden kaart. Een geautoriseerde aanvraag en actuele strategietoestand leiden tot een regel, een toegestane modeltaak of een stop. Uitkomsten worden opnieuw gecontroleerd.</desc><defs><marker id="d12-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52657b"/></marker></defs><rect width="960" height="625" rx="12" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="29" font-size="13" font-weight="700" fill="#37678e" text-anchor="start">VOORAF · BIJ GEWIJZIGDE BRON OF BELEID</text><g data-block-id="D12-SOURCE" data-block-sources="S11 S51" data-block-status="ontwerpvoorstel"><rect x="30" y="47" width="260" height="82" rx="9" fill="#ffffff" stroke="#c6d2df"/><text x="45" y="76" font-size="19" font-weight="700" fill="#18283c" text-anchor="start">Canonieke bronnen</text><text x="45" y="99" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">Identiteit, revisies, regels</text></g><g data-block-id="D12-COMPILER" data-block-sources="S51 S52 S53" data-block-status="ontwerpvoorstel"><rect x="350" y="47" width="260" height="82" rx="9" fill="#ffffff" stroke="#c6d2df"/><text x="365" y="76" font-size="19" font-weight="700" fill="#18283c" text-anchor="start">Compiler</text><text x="365" y="99" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">Normaliseer en valideer</text></g><g data-block-id="D12-ARTIFACT" data-block-sources="S11 S52" data-block-status="ontwerpvoorstel"><rect x="670" y="47" width="260" height="82" rx="9" fill="#e6eff6" stroke="#c6d2df"/><text x="685" y="76" font-size="19" font-weight="700" fill="#18283c" text-anchor="start">Versiegebonden kaart</text><text x="685" y="99" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">Vaste contracten, bron-ID’s</text></g><path d="M290 88H350" fill="none" stroke="#52657b" stroke-width="1.8" marker-end="url(#d12-arrow)" stroke-linecap="round" stroke-linejoin="round"/><path d="M610 88H670" fill="none" stroke="#52657b" stroke-width="1.8" marker-end="url(#d12-arrow)" stroke-linecap="round" stroke-linejoin="round"/><path d="M800 129V154H480V210" fill="none" stroke="#52657b" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#d12-arrow)" stroke-linecap="round" stroke-linejoin="round"/><text x="480" y="148" font-size="13" font-weight="700" fill="#52657b" text-anchor="middle">geldige kaart</text><text x="30" y="193" font-size="13" font-weight="700" fill="#37678e" text-anchor="start">TIJDENS DE AANVRAAG</text><g data-block-id="D12-REQUEST" data-block-sources="S11 S52" data-block-status="ontwerpvoorstel"><rect x="30" y="210" width="260" height="91" rx="9" fill="#ffffff" stroke="#c6d2df"/><text x="45" y="239" font-size="19" font-weight="700" fill="#18283c" text-anchor="start">Aanvraag + context</text><text x="45" y="262" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">Actuele rechten en revisies</text><text x="45" y="281" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">Gewone functies gedeeld</text></g><g data-block-id="D12-DECISION" data-block-sources="S11 S51" data-block-status="ontwerpvoorstel"><rect x="350" y="210" width="260" height="91" rx="9" fill="#e6eff6" stroke="#c6d2df"/><text x="365" y="239" font-size="19" font-weight="700" fill="#18283c" text-anchor="start">Toetsbare routekeuze</text><text x="365" y="262" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">Regel, onbekend of verboden</text></g><g data-block-id="D12-STATE" data-block-sources="S51 S53" data-block-status="ontwerpvoorstel"><rect x="670" y="210" width="260" height="91" rx="9" fill="#ffffff" stroke="#c6d2df"/><text x="685" y="239" font-size="19" font-weight="700" fill="#18283c" text-anchor="start">Strategietoestand</text><text x="685" y="262" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">Behouden of herzien</text><text x="685" y="281" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">Alleen geldige waarnemingen</text></g><path d="M290 255H350" fill="none" stroke="#52657b" stroke-width="1.8" marker-end="url(#d12-arrow)" stroke-linecap="round" stroke-linejoin="round"/><path d="M670 255H610" fill="none" stroke="#52657b" stroke-width="1.8" marker-end="url(#d12-arrow)" stroke-linecap="round" stroke-linejoin="round"/><path d="M480 301V338H160M480 338H800" fill="none" stroke="#52657b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M160 338V348" fill="none" stroke="#52657b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M480 338V348" fill="none" stroke="#52657b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M800 338V348" fill="none" stroke="#52657b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M160 371V379" fill="none" stroke="#52657b" stroke-width="1.8" marker-end="url(#d12-arrow)" stroke-linecap="round" stroke-linejoin="round"/><path d="M480 371V379" fill="none" stroke="#52657b" stroke-width="1.8" marker-end="url(#d12-arrow)" stroke-linecap="round" stroke-linejoin="round"/><path d="M800 371V379" fill="none" stroke="#52657b" stroke-width="1.8" marker-end="url(#d12-arrow)" stroke-linecap="round" stroke-linejoin="round"/><text x="160" y="365" font-size="13" font-weight="700" fill="#52657b" text-anchor="middle">GEDEELDE LOOKUP / MATCH</text><text x="480" y="365" font-size="13" font-weight="700" fill="#52657b" text-anchor="middle">UNKNOWN + TOESTEMMING</text><text x="800" y="365" font-size="13" font-weight="700" fill="#52657b" text-anchor="middle">DENY / GEEN ROUTE</text><g data-block-id="D12-LOCAL" data-block-sources="S11 S51" data-block-status="ontwerpvoorstel"><rect x="30" y="379" width="260" height="83" rx="9" fill="#ffffff" stroke="#c6d2df"/><text x="45" y="408" font-size="19" font-weight="700" fill="#18283c" text-anchor="start">Lokale uitvoerder</text><text x="45" y="431" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">Bekende actie of referentie</text></g><g data-block-id="D12-MODEL" data-block-sources="S10 S52 S51" data-block-status="ontwerpvoorstel"><rect x="350" y="379" width="260" height="83" rx="9" fill="#e6eff6" stroke="#c6d2df"/><text x="365" y="408" font-size="19" font-weight="700" fill="#18283c" text-anchor="start">Eén modeltaak</text><text x="365" y="431" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">Selecteer of genereer voorstel</text></g><g data-block-id="D12-STOP" data-block-sources="S11 S51" data-block-status="ontwerpvoorstel"><rect x="670" y="379" width="260" height="83" rx="9" fill="#f7ede8" stroke="#d9b9ae"/><text x="685" y="408" font-size="19" font-weight="700" fill="#a34f38" text-anchor="start">Niet uitvoeren</text><text x="685" y="431" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">Afwijzen; bij onzekerheid</text><text x="685" y="450" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">vraag of overdracht</text></g><path d="M160 462V489H225V515" fill="none" stroke="#52657b" stroke-width="1.8" marker-end="url(#d12-arrow)" stroke-linecap="round" stroke-linejoin="round"/><path d="M480 462V515" fill="none" stroke="#52657b" stroke-width="1.8" marker-end="url(#d12-arrow)" stroke-linecap="round" stroke-linejoin="round"/><g data-block-id="D12-COMMIT" data-block-sources="S11 S52" data-block-status="ontwerpvoorstel"><rect x="30" y="515" width="580" height="77" rx="9" fill="#ffffff" stroke="#c6d2df"/><text x="45" y="544" font-size="19" font-weight="700" fill="#18283c" text-anchor="start">Controleer en lever af</text><text x="45" y="567" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">Type, bron-ID, actuele revisie en rechten · trace per poging</text></g><text x="665" y="527" font-size="15" font-weight="400" fill="#a34f38" text-anchor="start">Geen modelbypass bij DENY.</text><text x="665" y="549" font-size="15" font-weight="400" fill="#a34f38" text-anchor="start">Een fout is niet automatisch</text><text x="665" y="571" font-size="15" font-weight="400" fill="#a34f38" text-anchor="start">UNKNOWN.</text></g></svg>
