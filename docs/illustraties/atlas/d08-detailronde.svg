<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="828" viewBox="0 0 1120 828" role="img" aria-labelledby="d08-title d08-desc"><title id="d08-title">Vijf onderzoeksgroepen uit de detailronde</title><desc id="d08-desc">Vijf groepen met bronidentiteit, selectieve context, toestand, routering en controle. De broncodes verwijzen naar geïnspecteerde openbare bestanden; de vragen zijn nog niet beantwoord voor Teacher Assistant.</desc><rect width="1120" height="828" rx="12" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="36" font-size="13" font-weight="700" fill="#37678e">EAI TEACHER ASSISTANT / ONDERZOEKSATLAS 08</text><text x="40" y="81" font-size="34" font-weight="700" fill="#18283c">Vijf onderzoeksgroepen uit de detailronde</text><text x="40" y="111" font-size="17" font-weight="400" fill="#52657b">Concrete bronvondsten naast elkaar. Geen voorgeschreven uitvoeringsvolgorde.</text><path d="M40 132 H1080" stroke="#c6d2df" fill="none"/><text x="40" y="160" font-size="13" font-weight="700" fill="#52657b">ONDERZOEKSGROEP</text><text x="330" y="160" font-size="13" font-weight="700" fill="#52657b">AANGETROFFEN MECHANISMEN</text><text x="808" y="160" font-size="13" font-weight="700" fill="#52657b">OPEN ONDERZOEKSVRAAG</text><g data-block-id="D08-BRON" data-block-sources="S37 S38 S39" data-block-status="historische_bron"><title>Bronidentiteit en opslag</title><rect x="40" y="178" width="1040" height="108" rx="8" fill="#fff" stroke="#c6d2df"/><rect x="40" y="190" width="4" height="84" rx="2" fill="#37678e"/><path d="M310 194 V270 M788 194 V270" stroke="#c6d2df"/><text x="56" y="207" font-size="13" font-weight="700" fill="#37678e">01</text><text x="56" y="236" font-size="19" font-weight="700" fill="#18283c">Bronidentiteit en opslag</text><text x="56" y="259" font-size="12" font-weight="400" fill="#52657b">D02 · D07</text><text x="330" y="206" font-size="16" font-weight="400" fill="#18283c">EAIhome: bronhash en FTS-index</text><text x="330" y="230" font-size="16" font-weight="400" fill="#18283c">Examenreglementcheck: parseversie</text><text x="330" y="254" font-size="16" font-weight="400" fill="#18283c">en expliciete extractiefouten</text><text x="808" y="221" font-size="16" font-weight="700" fill="#18283c">Welke bron en revisie</text><text x="808" y="244" font-size="16" font-weight="700" fill="#18283c">mag de uitvoering gebruiken?</text></g><g data-block-id="D08-CONTEXT" data-block-sources="S15 S17 S18 S19" data-block-status="historische_bron"><title>Selectieve context</title><rect x="40" y="298" width="1040" height="108" rx="8" fill="#fff" stroke="#c6d2df"/><rect x="40" y="310" width="4" height="84" rx="2" fill="#37678e"/><path d="M310 314 V390 M788 314 V390" stroke="#c6d2df"/><text x="56" y="327" font-size="13" font-weight="700" fill="#37678e">02</text><text x="56" y="356" font-size="19" font-weight="700" fill="#18283c">Selectieve context</text><text x="56" y="379" font-size="12" font-weight="400" fill="#52657b">B02 · B05 · B06 · B07</text><text x="330" y="326" font-size="16" font-weight="400" fill="#18283c">EAT_me: focus per beurt</text><text x="330" y="350" font-size="16" font-weight="400" fill="#18283c">EAT Inline: expliciete referenties</text><text x="330" y="374" font-size="16" font-weight="400" fill="#18283c">TOON / RAG: vorm en selectie</text><text x="808" y="341" font-size="16" font-weight="700" fill="#18283c">Wat is werkelijk nodig</text><text x="808" y="364" font-size="16" font-weight="700" fill="#18283c">voor dezelfde modeltaak?</text></g><g data-block-id="D08-STATE" data-block-sources="S23 S26 S27" data-block-status="historische_bron"><title>Toestand en geheugen</title><rect x="40" y="418" width="1040" height="108" rx="8" fill="#fff" stroke="#c6d2df"/><rect x="40" y="430" width="4" height="84" rx="2" fill="#37678e"/><path d="M310 434 V510 M788 434 V510" stroke="#c6d2df"/><text x="56" y="447" font-size="13" font-weight="700" fill="#37678e">03</text><text x="56" y="476" font-size="19" font-weight="700" fill="#18283c">Toestand en geheugen</text><text x="56" y="499" font-size="12" font-weight="400" fill="#52657b">B13 · B16 · B17</text><text x="330" y="446" font-size="16" font-weight="400" fill="#18283c">EAIwork: event-replay</text><text x="330" y="470" font-size="16" font-weight="400" fill="#18283c">Shadowseed: traceverval en TTL</text><text x="330" y="494" font-size="16" font-weight="400" fill="#18283c">Unieke waarnemingen apart tellen</text><text x="808" y="461" font-size="16" font-weight="700" fill="#18283c">Wanneer blijft een eerdere</text><text x="808" y="484" font-size="16" font-weight="700" fill="#18283c">toestand geldig of relevant?</text></g><g data-block-id="D08-ROUTE" data-block-sources="S21 S22 S43 S44" data-block-status="historische_bron"><title>Routering en uitvoering</title><rect x="40" y="538" width="1040" height="108" rx="8" fill="#fff" stroke="#c6d2df"/><rect x="40" y="550" width="4" height="84" rx="2" fill="#37678e"/><path d="M310 554 V630 M788 554 V630" stroke="#c6d2df"/><text x="56" y="567" font-size="13" font-weight="700" fill="#37678e">04</text><text x="56" y="596" font-size="19" font-weight="700" fill="#18283c">Routering en uitvoering</text><text x="56" y="619" font-size="12" font-weight="400" fill="#52657b">B11 · B12 · E02</text><text x="330" y="566" font-size="16" font-weight="400" fill="#18283c">NeSy: begrensde modeltaak</text><text x="330" y="590" font-size="16" font-weight="400" fill="#18283c">NGBSE: fases en stopcondities</text><text x="330" y="614" font-size="16" font-weight="400" fill="#18283c">Z3: worker- en wachtrijgrenzen</text><text x="808" y="581" font-size="16" font-weight="700" fill="#18283c">Welke route volstaat, en</text><text x="808" y="604" font-size="16" font-weight="700" fill="#18283c">wanneer is een model nodig?</text></g><g data-block-id="D08-CHECK" data-block-sources="S24 S25 S32 S47 S48 S50" data-block-status="historische_bron"><title>Controle en bevoegdheid</title><rect x="40" y="658" width="1040" height="108" rx="8" fill="#fff" stroke="#c6d2df"/><rect x="40" y="670" width="4" height="84" rx="2" fill="#37678e"/><path d="M310 674 V750 M788 674 V750" stroke="#c6d2df"/><text x="56" y="687" font-size="13" font-weight="700" fill="#37678e">05</text><text x="56" y="716" font-size="19" font-weight="700" fill="#18283c">Controle en bevoegdheid</text><text x="56" y="739" font-size="12" font-weight="400" fill="#52657b">B14 · B15 · B22 · E07 · F08</text><text x="330" y="686" font-size="16" font-weight="400" fill="#18283c">EAIwork: bewijsanker en rechten</text><text x="330" y="710" font-size="16" font-weight="400" fill="#18283c">EAI-lab: echt versus simulatie</text><text x="330" y="734" font-size="16" font-weight="400" fill="#18283c">PiM: integriteit en egress</text><text x="808" y="701" font-size="16" font-weight="700" fill="#18283c">Wat mag worden afgeleverd</text><text x="808" y="724" font-size="16" font-weight="700" fill="#18283c">en wat is werkelijk bewezen?</text></g><text x="40" y="802" font-size="14" font-weight="700" fill="#52657b">Ronde 09 · broninspectie en ontwerpvragen · geen nieuwe uitvoeringstests · fase 4a: NO-GO</text></g></svg>
