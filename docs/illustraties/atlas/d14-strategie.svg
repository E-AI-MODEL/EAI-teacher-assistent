<svg xmlns="http://www.w3.org/2000/svg" width="960" height="515" viewBox="0 0 960 515" role="img" aria-labelledby="d14-title d14-desc"><title id="d14-title">Strategie vasthouden zonder onzekerheid te verbergen</title><desc id="d14-desc">Een toestandmachine onderscheidt waarnemen, strategie behouden en opnieuw beoordelen. Kleine afwijkingen hoeven geen wissel te veroorzaken. Kritieke wijzigingen doorbreken een lock. Een illustratief beurtverloop toont stabiele beurten, afwijking en herziening.</desc><defs><marker id="d14-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52657b"/></marker></defs><rect width="960" height="515" rx="12" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="28" font-size="13" font-weight="700" fill="#37678e" text-anchor="start">TOESTANDMACHINE · VOORSTEL</text><g data-block-id="D14-OBSERVE" data-block-sources="S51" data-block-status="ontwerpvoorstel"><rect x="30" y="65" width="260" height="100" rx="9" fill="#ffffff" stroke="#c6d2df"/><text x="45" y="94" font-size="19" font-weight="700" fill="#18283c" text-anchor="start">Waarnemen</text><text x="45" y="117" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">Expliciete signalen</text><text x="45" y="136" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">Onbekend blijft onbekend</text></g><g data-block-id="D14-HOLD" data-block-sources="S51 S53" data-block-status="ontwerpvoorstel"><rect x="350" y="65" width="260" height="100" rx="9" fill="#e6eff6" stroke="#c6d2df"/><text x="365" y="94" font-size="19" font-weight="700" fill="#18283c" text-anchor="start">Strategie behouden</text><text x="365" y="117" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">Geldig venster en ankers</text><text x="365" y="136" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">Hysteresis tegen ruis</text></g><g data-block-id="D14-REVIEW" data-block-sources="S51 S53" data-block-status="ontwerpvoorstel"><rect x="670" y="65" width="260" height="100" rx="9" fill="#ffffff" stroke="#c6d2df"/><text x="685" y="94" font-size="19" font-weight="700" fill="#18283c" text-anchor="start">Opnieuw beoordelen</text><text x="685" y="117" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">Vernieuw kandidaat</text><text x="685" y="136" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">Pas geldige regels toe</text></g><path d="M290 114H350" fill="none" stroke="#52657b" stroke-width="1.8" marker-end="url(#d14-arrow)" stroke-linecap="round" stroke-linejoin="round"/><path d="M610 114H670" fill="none" stroke="#52657b" stroke-width="1.8" marker-end="url(#d14-arrow)" stroke-linecap="round" stroke-linejoin="round"/><text x="320" y="104" font-size="11" font-weight="700" fill="#52657b" text-anchor="middle">geldig</text><text x="640" y="104" font-size="11" font-weight="700" fill="#52657b" text-anchor="middle">grens</text><path d="M800 165V201H160V165" fill="none" stroke="#52657b" stroke-width="1.8" marker-end="url(#d14-arrow)" stroke-linecap="round" stroke-linejoin="round"/><text x="480" y="193" font-size="13" font-weight="700" fill="#52657b" text-anchor="middle">NIEUWE WAARNEMINGEN / UITKOMST</text><g data-block-id="D14-INTERRUPT" data-block-sources="S51" data-block-status="ontwerpvoorstel"><rect x="30" y="230" width="900" height="65" rx="9" fill="#f7ede8" stroke="#d9b9ae"/><text x="48" y="256" font-size="20" font-weight="700" fill="#a34f38" text-anchor="start">Interrupt heeft voorrang op de lock</text><text x="48" y="279" font-size="16" font-weight="400" fill="#52657b" text-anchor="start">Intrekking, conflict of kritieke verandering: eerst opnieuw toetsen.</text></g><text x="30" y="333" font-size="13" font-weight="700" fill="#37678e" text-anchor="start">ILLUSTRATIEF BEURTVERLOOP · GEEN GEMETEN DATA</text><g data-block-id="D14-WINDOW" data-block-sources="S51 S53" data-block-status="ontwerpvoorstel