<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="724" viewBox="0 0 1120 724" role="img" aria-labelledby="d06-title d06-desc"><title id="d06-title">Wat eerdere proeven werkelijk aantonen</title><desc id="d06-desc">EAT Inline: 77,42% naamzoeken versus 98,85% EAT na unieke naamkoppeling; 100% is een controle met correct ID uit testantwoorden. NeSy P02: nul van tien doelroutes; P03: acht van acht herbeoordelingen en nul onafhankelijke menselijke beoordelingen.</desc><defs><marker id="d06-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#52657b"/></marker></defs><rect width="1120" height="724" rx="12" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="36" font-size="13" font-weight="700" fill="#37678e" text-anchor="start">EAI TEACHER ASSISTANT  /  ONDERZOEKSATLAS 06</text><text x="40" y="81" font-size="34" font-weight="700" fill="#18283c" text-anchor="start">Wat eerdere proeven werkelijk aantonen</text><text x="40" y="111" font-size="17" font-weight="400" fill="#52657b" text-anchor="start">Twee experimentfamilies. De cijfers zijn niet onderling vergelijkbaar.</text><path d="M 40 132 H 1080" stroke="#c6d2df" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="160" width="1040" height="244" rx="8" fill="#fff" stroke="#c6d2df" stroke-width="1"/><text x="60" y="188" font-size="14" font-weight="700" fill="#37678e" text-anchor="start">EAT INLINE  /  BRONSELECTIE</text><text x="60" y="218" font-size="23" font-weight="700" fill="#18283c" text-anchor="start">434 exacte registervragen</text><text x="60" y="245" font-size="16" font-weight="400" fill="#52657b" text-anchor="start">Correct bronantwoord, 0–100%</text><g data-block-id="D06-EAT1" data-block-sources="S02" data-block-status="historische_meting"><title>Zoeken op naam: Bij ambigue naam terugval op naamzoekfunctie.</title><text x="60" y="277" font-size="16" font-weight="400" fill="#18283c" text-anchor="start">Zoeken op naam</text><rect x="356" y="260" width="568" height="20" rx="3" fill="#e9eef3" stroke="none" stroke-width="1"/><rect x="356" y="260" width="439.74559999999997" height="20" rx="3" fill="#9eafbe" stroke="none" stroke-width="1"/><text x="952" y="277" font-size="17" font-weight="700" fill="#18283c" text-anchor="start">77,42%</text></g><g data-block-id="D06-EAT2" data-block-sources="S02" data-block-status="historische_meting"><title>EAT na unieke koppeling: Bij ambigue naam terugval op naamzoekfunctie.</title><text x="60" y="313" font-size="16" font-weight="700" fill="#18283c" text-anchor="start">EAT na unieke koppeling</text><rect x="356" y="296" width="568" height="20" rx="3" fill="#e9eef3" stroke="none" stroke-width="1"/><rect x="356" y="296" width="561.468" height="20" rx="3" fill="#37678e" stroke="none" stroke-width="1"/><text x="952" y="313" font-size="17" font-weight="700" fill="#18283c" text-anchor="start">98,85%</text></g><g data-block-id="D06-EAT3" data-block-sources="S02" data-block-status="oracle_controle"><title>Correct ID vooraf gegeven: Correct ID uit testantwoorden; geen onafhankelijke voorspelling.</title><text x="60" y="349" font-size="16" font-weight="400" fill="#18283c" text-anchor="start">Correct ID vooraf gegeven</text><rect x="356" y="332" width="568" height="20" rx="3" fill="#e9eef3" stroke="none" stroke-width="1"/><rect x="356" y="332" width="568" height="20" rx="3" fill="#9eafbe" stroke="none" stroke-width="1"/><text x="952" y="349" font-size="17" font-weight="700" fill="#18283c" text-anchor="start">100%</text></g><text x="60" y="390" font-size="14" font-weight="400" fill="#52657b" text-anchor="start">100.000 gegenereerde documenten, 669 fragmenten uit 40 pagina's. Geen LLM in deze proef.</text><g data-block-id="D06-P02" data-block-sources="S08" data-block-status="mislukte_historische_proef"><title>P0-beurten bereikten S1/S2</title><rect x="40" y="424" width="512" height="240" rx="8" fill="#fff" stroke="#c6d2df" stroke-width="1"/><text x="60" y="452" font-size="13" font-weight="700" fill="#52657b" text-anchor="start">NESY P02  /  23 OKT 2026</text><text x="60" y="511" font-size="48" font-weight="700" fill="#18283c" text-anchor="start">0 / 10</text><text x="60" y="539" font-size="20" font-weight="700" fill="#18283c" text-anchor="start">P0-beurten bereikten S1/S2</text><text x="60" y="579" font-size="16" font-weight="400" fill="#52657b" text-anchor="start">20 echte modelrequests.</text><text x="60" y="603" font-size="16" font-weight="400" fill="#52657b" text-anchor="start">De vergelijking kon niet plaatsvinden.</text><text x="60" y="627" font-size="16" font-weight="400" fill="#52657b" text-anchor="start">Geen uitspraak over het effect van S2.</text></g><g data-block-id="D06-P03" data-block-sources="S09" data-block-status="historische_sandboxmeting"><title>Geplande S2-herbeoordelingen</title><rect x="568" y="424" width="512" height="240" rx="8" fill="#fff" stroke="#c6d2df" stroke-width="1"/><text x="588" y="452" font-size="13" font-weight="700" fill="#52657b" text-anchor="start">NESY P03  /  23 OKT 2026</text><text x="588" y="511" font-size="48" font-weight="700" fill="#18283c" text-anchor="start">8 / 8</text><text x="588" y="539" font-size="20" font-weight="700" fill="#18283c" text-anchor="start">Geplande S2-herbeoordelingen</text><text x="588" y="579" font-size="16" font-weight="400" fill="#52657b" text-anchor="start">14 fictieve gevallen; 16 modelrequests.</text><text x="588" y="603" font-size="16" font-weight="400" fill="#52657b" text-anchor="start">Controllerstatus was gesimuleerd.</text><text x="588" y="627" font-size="16" font-weight="400" fill="#52657b" text-anchor="start">0 onafhankelijke menselijke beoordelingen.</text></g><path d="M 40 680 H 1080" stroke="#c6d2df" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="705" font-size="14" font-weight="400" fill="#52657b" text-anchor="start">S02, S08, S09 · Historische rapportages opnieuw gelezen; geen nieuwe meting, leerwinst of tokenbesparing.</text></g></svg>
