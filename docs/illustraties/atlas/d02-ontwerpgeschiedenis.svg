<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="d02-title d02-desc"><title id="d02-title">Ontwerpgeschiedenis in vijf momenten</title><desc id="d02-desc">Vijf gedateerde momenten in 2026; de SSOT-migratiekaart beschrijft een versieontwikkeling. De andere gebeurtenissen zijn afzonderlijke bronnen.</desc><defs><marker id="d02-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#52657b"/></marker></defs><rect width="1120" height="520" rx="12" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="36" font-size="13" font-weight="700" fill="#37678e" text-anchor="start">EAI TEACHER ASSISTANT  /  ONDERZOEKSATLAS 02</text><text x="40" y="81" font-size="34" font-weight="700" fill="#18283c" text-anchor="start">Ontwerpgeschiedenis in vijf momenten</text><text x="40" y="111" font-size="17" font-weight="400" fill="#52657b" text-anchor="start">Kalenderdagen bepalen de afstand. Bronnen zijn niet automatisch elkaars opvolgers.</text><path d="M 40 132 H 1080" stroke="#c6d2df" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 84 320 H 1036" stroke="#52657b" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 84 320 V 300 H 152 V 288" stroke="#c6d2df" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="84" cy="320" r="4" fill="#18283c"/><g data-block-id="D02-1" data-block-sources="S06" data-block-status="historische_bron"><title>Reproductie</title><rect x="40" y="164" width="224" height="124" rx="8" fill="#fff" stroke="#c6d2df" stroke-width="1"/><text x="54" y="187" font-size="12" font-weight="700" fill="#37678e" text-anchor="start">29 APR</text><text x="54" y="215" font-size="19" font-weight="700" fill="#18283c" text-anchor="start">Reproductie</text><text x="54" y="237" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">Bewaar besluiten, versies</text><text x="54" y="257" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">en mislukte runs.</text></g><path d="M 340 320 V 336 H 382 V 348" stroke="#c6d2df" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="340" cy="320" r="4" fill="#18283c"/><g data-block-id="D02-2" data-block-sources="S07" data-block-status="historische_bron"><title>SSOT 17</title><rect x="240" y="348" width="284" height="124" rx="8" fill="#fff" stroke="#c6d2df" stroke-width="1"/><text x="254" y="371" font-size="12" font-weight="700" fill="#37678e" text-anchor="start">25 JUN · SNAPSHOT</text><text x="254" y="399" font-size="19" font-weight="700" fill="#18283c" text-anchor="start">SSOT 17</text><text x="254" y="421" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">10 rubrics → 15 parameters</text><text x="254" y="441" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">→ 18 rubrics; andere eenheden.</text></g><path d="M 466 320 V 300 H 500 V 288" stroke="#c6d2df" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="466" cy="320" r="4" fill="#18283c"/><g data-block-id="D02-3" data-block-sources="S02" data-block-status="historische_bron"><title>EAT Inline</title><rect x="388" y="164" width="224" height="124" rx="8" fill="#fff" stroke="#c6d2df" stroke-width="1"/><text x="402" y="187" font-size="12" font-weight="700" fill="#37678e" text-anchor="start">23 JUL · SNAPSHOT</text><text x="402" y="215" font-size="19" font-weight="700" fill="#18283c" text-anchor="start">EAT Inline</text><text x="402" y="237" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">Naamkoppeling en</text><text x="402" y="257" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">bronselectie getest.</text></g><path d="M 879 320 V 336 H 856 V 348" stroke="#c6d2df" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="879" cy="320" r="4" fill="#18283c"/><g data-block-id="D02-4" data-block-sources="S08 S09" data-block-status="historische_bron"><title>NeSy P02 / P03</title><rect x="744" y="348" width="224" height="124" rx="8" fill="#fff" stroke="#c6d2df" stroke-width="1"/><text x="758" y="371" font-size="12" font-weight="700" fill="#37678e" text-anchor="start">23 OKT</text><text x="758" y="399" font-size="19" font-weight="700" fill="#18283c" text-anchor="start">NeSy P02 / P03</text><text x="758" y="421" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">Doelroute niet bereikt;</text><text x="758" y="441" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">daarna sandboxproef.</text></g><path d="M 1036 320 V 300 H 968 V 288" stroke="#c6d2df" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1036" cy="320" r="6" fill="#37678e"/><g data-block-id="D02-5" data-block-sources="S11 S12" data-block-status="projectontwerp"><title>Teacher Assistant</title><rect x="856" y="164" width="224" height="124" rx="8" fill="#e4edf5" stroke="#37678e" stroke-width="1"/><text x="870" y="187" font-size="12" font-weight="700" fill="#37678e" text-anchor="start">27 NOV</text><text x="870" y="215" font-size="19" font-weight="700" fill="#18283c" text-anchor="start">Teacher Assistant</text><text x="870" y="237" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">Vier technische routes;</text><text x="870" y="257" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">proeven nog te draaien.</text></g><path d="M 40 476 H 1080" stroke="#c6d2df" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="501" font-size="14" font-weight="400" fill="#52657b" text-anchor="start">S06, S07, S02, S08–S09, S11 · Datum = documentdatum of benoemde snapshotdatum.</text></g></svg>
