<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="812" viewBox="0 0 1120 812" role="img" aria-labelledby="d09-title d09-desc"><title id="d09-title">Technische afgeleiden uit besloten bronnen</title><desc id="d09-desc">Vijf groepen technische mechanismen uit besloten onderzoek: strategie, compiler, representatie, uitvoering en aflevergrenzen. De DPR-codes verwijzen naar publieke afgeleiden. Oorspronkelijke bronkoppelingen zijn alleen intern beschikbaar.</desc><rect width="1120" height="812" rx="12" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="36" font-size="13" font-weight="700" fill="#37678e">EAI TEACHER ASSISTANT / ONDERZOEKSATLAS 09</text><text x="40" y="81" font-size="34" font-weight="700" fill="#18283c">Technische afgeleiden uit besloten bronnen</text><text x="40" y="111" font-size="17" font-weight="400" fill="#52657b">Vijf onderzoeksgroepen, 38 records. Vergelijk mechanismen vóór een architectuurkeuze.</text><path d="M40 132 H1080" stroke="#c6d2df" fill="none"/><text x="40" y="159" font-size="13" font-weight="700" fill="#52657b">GROEP</text><text x="420" y="159" font-size="13" font-weight="700" fill="#52657b">VOORBEELDEN VAN MECHANISMEN</text><g data-block-id="D09-STATE" data-block-sources="S51" data-block-status="afgeleid_onderzoek"><title>Toestand en strategie</title><rect x="40" y="176" width="1040" height="104" rx="8" fill="#fff" stroke="#c6d2df"/><rect x="40" y="188" width="4" height="80" rx="2" fill="#37678e"/><path d="M400 190 V266" stroke="#c6d2df"/><text x="56" y="200" font-size="13" font-weight="700" fill="#37678e">DPR01–DPR08</text><text x="56" y="228" font-size="19" font-weight="700" fill="#18283c">Toestand en strategie</text><text x="56" y="254" font-size="15" font-weight="400" fill="#52657b">Vasthouden, herzien of loslaten</text><text x="420" y="204" font-size="17" font-weight="400" fill="#18283c">Gewogen entropie · dual track</text><text x="420" y="228" font-size="17" font-weight="400" fill="#18283c">Constellation locking · hysteresis</text><text x="420" y="252" font-size="17" font-weight="400" fill="#18283c">Adaptief venster · ankers en interrupt</text></g><g data-block-id="D09-COMPILE" data-block-sources="S51" data-block-status="afgeleid_onderzoek"><title>Compiler en context</title><rect x="40" y="292" width="1040" height="104" rx="8" fill="#fff" stroke="#c6d2df"/><rect x="40" y="304" width="4" height="80" rx="2" fill="#37678e"/><path d="M400 306 V382" stroke="#c6d2df"/><text x="56" y="316" font-size="13" font-weight="700" fill="#37678e">DPR09–DPR16</text><text x="56" y="344" font-size="19" font-weight="700" fill="#18283c">Compiler en context</text><text x="56" y="370" font-size="15" font-weight="400" fill="#52657b">Eenmalig voorbereiden, gericht gebruiken</text><text x="420" y="320" font-size="17" font-weight="400" fill="#18283c">Instructiekaart · compacte projectie</text><text x="420" y="344" font-size="17" font-weight="400" fill="#18283c">Startsnapshot · runtime-overlay</text><text x="420" y="368" font-size="17" font-weight="400" fill="#18283c">Deterministische reeks en fallback</text></g><g data-block-id="D09-REP" data-block-sources="S51" data-block-status="afgeleid_onderzoek"><title>Representatie en selectie</title><rect x="40" y="408" width="1040" height="104" rx="8" fill="#fff" stroke="#c6d2df"/><rect x="40" y="420" width="4" height="80" rx="2" fill="#37678e"/><path d="M400 422 V498" stroke="#c6d2df"/><text x="56" y="432" font-size="13" font-weight="700" fill="#37678e">DPR17–DPR24</text><text x="56" y="460" font-size="19" font-weight="700" fill="#18283c">Representatie en selectie</text><text x="56" y="486" font-size="15" font-weight="400" fill="#52657b">Betekenis behouden in compacte gegevens</text><text x="420" y="436" font-size="17" font-weight="400" fill="#18283c">Vaste vectorposities · exact patroon</text><text x="420" y="460" font-size="17" font-weight="400" fill="#18283c">TTL · gescheiden waarneming</text><text x="420" y="484" font-size="17" font-weight="400" fill="#18283c">Parser · bronselectie · compressie</text></g><g data-block-id="D09-ROUTE" data-block-sources="S51" data-block-status="afgeleid_onderzoek"><title>Uitvoering en modeltaken</title><rect x="40" y="524" width="1040" height="104" rx="8" fill="#fff" stroke="#c6d2df"/><rect x="40" y="536" width="4" height="80" rx="2" fill="#37678e"/><path d="M400 538 V614" stroke="#c6d2df"/><text x="56" y="548" font-size="13" font-weight="700" fill="#37678e">DPR25–DPR31</text><text x="56" y="576" font-size="19" font-weight="700" fill="#18283c">Uitvoering en modeltaken</text><text x="56" y="602" font-size="15" font-weight="400" fill="#52657b">Vergelijk werkelijk bereikte routes</text><text x="420" y="552" font-size="17" font-weight="400" fill="#18283c">Symbolisch-neurale fusie</text><text x="420" y="576" font-size="17" font-weight="400" fill="#18283c">Eén gezamenlijke modeltaak</text><text x="420" y="600" font-size="17" font-weight="400" fill="#18283c">Callgrafiek · readiness · retrygrens</text></g><g data-block-id="D09-DELIVERY" data-block-sources="S51" data-block-status="afgeleid_onderzoek"><title>Staat, aflevering en controle</title><rect x="40" y="640" width="1040" height="104" rx="8" fill="#fff" stroke="#c6d2df"/><rect x="40" y="652" width="4" height="80" rx="2" fill="#37678e"/><path d="M400 654 V730" stroke="#c6d2df"/><text x="56" y="664" font-size="13" font-weight="700" fill="#37678e">DPR32–DPR38</text><text x="56" y="692" font-size="19" font-weight="700" fill="#18283c">Staat, aflevering en controle</text><text x="56" y="718" font-size="15" font-weight="400" fill="#52657b">Controle op het punt van gebruik</text><text x="420" y="668" font-size="17" font-weight="400" fill="#18283c">Bevestigde queue · regels en advies</text><text x="420" y="692" font-size="17" font-weight="400" fill="#18283c">Laatste uitvoercontrole · parity</text><text x="420" y="716" font-size="17" font-weight="400" fill="#18283c">UNKNOWN · overgang · aflevering</text></g><text x="40" y="784" 