<svg xmlns="http://www.w3.org/2000/svg" width="960" height="484" viewBox="0 0 960 484" role="img" aria-labelledby="d13-title d13-desc"><title id="d13-title">De startsnapshot is niet de actuele toestemming</title><desc id="d13-desc">Bronversie, voorbereid artifact en sessietoestand hebben afzonderlijke identiteit. Een aanvraag van revisie 1 arriveert na revisie 3; ook bij dezelfde waarde moet de verouderde uitkomst worden geweigerd.</desc><defs><marker id="d13-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52657b"/></marker></defs><rect width="960" height="484" rx="12" fill="#f5f7fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="28" font-size="13" font-weight="700" fill="#37678e" text-anchor="start">GEGEVENSCONTRACT</text><g data-block-id="D13-BUNDLE" data-block-sources="S11 S52" data-block-status="ontwerpvoorstel"><rect x="30" y="46" width="260" height="89" rx="9" fill="#ffffff" stroke="#c6d2df"/><text x="45" y="75" font-size="19" font-weight="700" fill="#18283c" text-anchor="start">Bronbundel</text><text x="45" y="98" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">Bron + schema + beleid</text><text x="45" y="117" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">Inhoudsdigest</text></g><g data-block-id="D13-CARD" data-block-sources="S11 S51" data-block-status="ontwerpvoorstel"><rect x="350" y="46" width="260" height="89" rx="9" fill="#e6eff6" stroke="#c6d2df"/><text x="365" y="75" font-size="19" font-weight="700" fill="#18283c" text-anchor="start">Artifact</text><text x="365" y="98" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">Bron- en compilerversie</text><text x="365" y="117" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">Toegestane referenties</text></g><g data-block-id="D13-OVERLAY" data-block-sources="S11 S52" data-block-status="ontwerpvoorstel"><rect x="670" y="46" width="260" height="89" rx="9" fill="#ffffff" stroke="#c6d2df"/><text x="685" y="75" font-size="19" font-weight="700" fill="#18283c" text-anchor="start">Actuele context</text><text x="685" y="98" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">Scope + sessierevisie</text><text x="685" y="117" font-size="15" font-weight="400" fill="#52657b" text-anchor="start">Geldige runtime-overlay</text></g><path d="M290 90H350" fill="none" stroke="#52657b" stroke-width="1.8" marker-end="url(#d13-arrow)" stroke-linecap="round" stroke-linejoin="round"/><path d="M610 90H670" fill="none" stroke="#52657b" stroke-width="1.8" marker-end="url(#d13-arrow)" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="183" font-size="13" font-weight="700" fill="#37678e" text-anchor="start">VOORBEELD · DE WAARDE KEERT TERUG, DE REVISIE NIET</text><path d="M95 242H865" fill="none" stroke="#52657b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g data-block-id="D13-REVISIONS" data-block-sources="S11 S52" data-block-status="ontwerpvoorstel"><circle cx="95" cy="242" r="7" fill="#37678e"/><text x="95" y="224" font-size="21" font-weight="700" fill="#18283c" text-anchor="middle">V1</text><text x="95" y="273" font-size="16" font-weight="400" fill="#52657b" text-anchor="middle">R1 toegestaan</text><text x="95" y="294" font-size="16" font-weight="400" fill="#52657b" text-anchor="middle">Aanvraag gestart</text><circle cx="480" cy="242" r="7" fill="#37678e"/><text x="480" y="224" font-size="21" font-weight="700" fill="#18283c" text-anchor="middle">V2</text><text x="480" y="273" font-size="16" font-weight="400" fill="#52657b" text-anchor="middle">R1 ingetrokken</text><text x="480" y="294" font-size="16" font-weight="400" fill="#52657b" text-anchor="middle">Beleid wijzigt</text><circle cx="865" cy="242" r="7" fill="#37678e"/><text x="865" y="224" font-size="21" font-weight="700" fill="#18283c" text-anchor="middle">V3</text><text x="865" y="273" font-size="16" font-weight="400" fill="#52657b" text-anchor="middle">R1 weer toegestaan</text><text x="865" y="294" font-size="16" font-weight="400" fill="#52657b" text-anchor="middle">Nieuwe revisie</text></g><path d="M95 309V343H865V321" fill="none" stroke="#52657b" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#d13-arrow)" stroke-linecap="round" stroke-linejoin="round"/><text x="480" y="336" font-size="13" font-weight="700" fill="#52657b" text-anchor="middle">OUD RESULTAAT KOMT TERUG</text><g data-block-id="D13-REJECT" data-block-sources="S11 S52" data-block-status="ontwerpvoorstel"><rect x="30" y="371" width="900" height="78" rx="9" fill="#f7ede8" stroke="#d9b9ae"/><text x="49" y="401" font-size="22" font-weight="700" fill="#a34f38" text-anchor="start">Niet afleveren: V1 ≠ V3</text><text x="49" y="426" font-size="17" font-weight="400" fill="#52657b" text-anchor="start">Vergelijk monotone revisie én actuele rechten, niet alleen gelijke waarden.</text></g></g></svg>
